# ============================================================================
#  dotbackup.conf — optional; copy to ~/.config/sumi-files/dotbackup.conf.
#  key = value, parsed (never sourced). Command-line options win over these.
#  Manual: docs/DOTBACKUP.md
# ============================================================================

# Your clone of the dotfiles repository. Needed when dotbackup is copied
# (not symlinked) into ~/.local/bin, and by dotbackup-remind.timer.
repo = ~/Projects/Sumi-Files

# Live config root (default: $XDG_CONFIG_HOME or ~/.config)
# source = ~/.config

# Refuse to run when the current branch isn't this one ('' disables)
branch = main

# Refuse to run when the remote URL doesn't match this glob (recommended:
# protects against pushing your config to the wrong repository)
# expect_remote = *github.com*/your-user/your-dotfiles*

# remote = origin
# snapshot_dir = ~/.cache/dotbackup/snapshots
# keep = 5

# Extra rsync exclude patterns, one per line, repeatable
# exclude = *.local.lua

# normalize_home = true
