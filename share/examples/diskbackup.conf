# ============================================================================
#  diskbackup.conf — copy to ~/.config/sumi-files/diskbackup.conf and edit.
#  Parsed, never sourced. '#' or ';' starts a comment. Paths may start with
#  ~/ or $HOME/; nothing else is expanded. Must be owned by you and not
#  writable by group/others ([state] runs commands from it).
#  Manual: docs/DISKBACKUP.md
# ============================================================================

[general]
# Where everything goes. Run `diskbackup --init` once, WITH THE DISK MOUNTED,
# to create it and its .diskbackup-target marker; nothing is ever written to a
# folder without it. A destination on the system disk (same filesystem as /
# or $HOME) is refused unless initialised with --allow-system-disk.
dest = /mnt/backup/diskbackup

# Refuse to run unless this is a mount point (protects against writing onto
# the empty mount directory of an unplugged disk). Leave empty to disable.
require_mount = /mnt/backup

# Mirrors delete what was deleted at the source. false = keep everything.
delete = true

[repos]
# path = name  →  <dest>/git-mirrors/<name>.git (bare mirror, from the local
# clone: works offline and includes commits you haven't pushed yet)
~/Projects/Sumi-Files = Sumi-Files

[themes]
# path = name  →  <dest>/manual-themes/<name>
# Themes, icons and cursors installed by hand (packages are already in the
# pacman inventory below).
# ~/.local/share/icons/MyIconTheme = MyIconTheme

[files]
# One path per line → <dest>/private-files/<path relative to ~/.config>
# (files outside ~/.config go under _home/ or _root/). Ideal for the files
# Sumi-Files keeps out of git on purpose.
~/.config/hypr/modules/private.lua
~/.config/fish/conf.d/local.fish
~/.config/sumi-files/private-patterns

[dirs]
# path = name  →  <dest>/local-dirs/<name>
~/.local/bin = local-bin
~/.config/systemd/user = systemd-user
# ~/Pictures/Wallpapers = wallpapers

[state]
# name.txt = command  →  <dest>/system-state/<name.txt>, run with `sh -c`.
# A plain-text inventory turns a reinstall into following a list.
pacman-explicit.txt = pacman -Qqe
pacman-foreign.txt = pacman -Qqm
systemd-user-enabled.txt = systemctl --user list-unit-files --state=enabled --no-pager
systemd-system-enabled.txt = systemctl list-unit-files --state=enabled --no-pager
etc-fstab.txt = cat /etc/fstab

[snapshots]
# Copies the newest dotbackup safety tarball off the system disk. Never pruned.
from = ~/.cache/dotbackup/snapshots
glob = snapshot-*.tar.gz
