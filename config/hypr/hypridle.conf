general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = ~/.config/hypr/scripts/lock.sh instant
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # R3: sin la palabra "hyprlock" en lock_cmd, el modo automático de
    # hypridle 0.1.8 dejaría de esperar al bloqueo antes de suspender
    # (docs/lock/CONFIGURACION.md §2, docs/lock/SEGURIDAD.md R3).
    inhibit_sleep = 3
}

# Plazos de inactividad: los escribe Settings → System → Power (Sumi Shell)
source = ~/.config/hypr/hypridle-sumi.conf
