# Colores y fuente
include colors/colors.conf

font_family                         IosevkaTerm Nerd Font
font_size                           9.0

# Apariencia
background_opacity                  0.85
window_padding_width                15
scrollbar                           never

# Cursor y estela
cursor_shape                        underline
cursor_underline_thickness          1
cursor_shape_unfocused              underline
cursor_trail                        1
cursor_trail_start_threshold        0
cursor_trail_decay                  0.1 1

# Uso diario
shell_integration                   no-cursor
confirm_os_window_close             0
underline_hyperlinks                always
mouse_hide_wait                     -1.0
enable_audio_bell                   no

# Copiar y pegar
copy_on_select                      yes
clipboard_control                   write-clipboard read-clipboard-ask
paste_actions                       quote-urls-at-prompt,confirm,confirm-if-large
strip_trailing_spaces               smart
# >>> sumi-shell typography: added by the shell's font sync; undo it from Settings → Theme → Typography → Other apps
include sumi-shell-fonts.conf
# <<< sumi-shell typography
