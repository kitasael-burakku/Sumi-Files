[ColorScheme]
# Paleta compartida qt5ct/qt6ct: orden QPalette 0..20 (Qt >= 5.12).
# Pares texto/fondo de Matugen; biseles relativos al fondo del botón.
# BrightText blanco contrasta con Dark (oscurecido 60 puntos); Shadow negro.
# NoRole (17) no participa en el dibujo. Accent (Qt >= 6.6) hereda Highlight.
# Disabled reduce el énfasis; no reutiliza grises de una paleta siempre oscura.
active_colors={{colors.on_surface.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.surface_container_high.default.hex | lighten: 12}}, {{colors.surface_container_high.default.hex | lighten: 6}}, {{colors.surface_container_high.default.hex | lighten: -60}}, {{colors.surface_container_high.default.hex | lighten: -8}}, {{colors.on_surface.default.hex}}, #ffffff, {{colors.on_surface.default.hex}}, {{colors.surface_container_low.default.hex}}, {{colors.surface.default.hex}}, #000000, {{colors.primary.default.hex}}, {{colors.on_primary.default.hex}}, {{colors.primary.default.hex}}, {{colors.tertiary.default.hex}}, {{colors.surface_container.default.hex}}, #000000, {{colors.inverse_surface.default.hex}}, {{colors.inverse_on_surface.default.hex}}, {{colors.on_surface_variant.default.hex}}
disabled_colors={{colors.on_surface_variant.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.surface_container_high.default.hex | lighten: 12}}, {{colors.surface_container_high.default.hex | lighten: 6}}, {{colors.surface_container_high.default.hex | lighten: -60}}, {{colors.surface_container_high.default.hex | lighten: -8}}, {{colors.on_surface_variant.default.hex}}, #ffffff, {{colors.on_surface_variant.default.hex}}, {{colors.surface_container_low.default.hex}}, {{colors.surface.default.hex}}, #000000, {{colors.surface_container_high.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.surface_container.default.hex}}, #000000, {{colors.inverse_surface.default.hex}}, {{colors.inverse_on_surface.default.hex}}, {{colors.on_surface_variant.default.hex}}
inactive_colors={{colors.on_surface.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.surface_container_high.default.hex | lighten: 12}}, {{colors.surface_container_high.default.hex | lighten: 6}}, {{colors.surface_container_high.default.hex | lighten: -60}}, {{colors.surface_container_high.default.hex | lighten: -8}}, {{colors.on_surface.default.hex}}, #ffffff, {{colors.on_surface.default.hex}}, {{colors.surface_container_low.default.hex}}, {{colors.surface.default.hex}}, #000000, {{colors.primary.default.hex}}, {{colors.on_primary.default.hex}}, {{colors.primary.default.hex}}, {{colors.tertiary.default.hex}}, {{colors.surface_container.default.hex}}, #000000, {{colors.inverse_surface.default.hex}}, {{colors.inverse_on_surface.default.hex}}, {{colors.on_surface_variant.default.hex}}
