# --- Minimaru · dinámico (matugen) ---
# Generado por matugen — no editar a mano.
# Estático de referencia: ~/.config/kitty/colors/colors.static.conf
background            {{colors.background.default.hex}}
foreground             {{colors.on_surface.default.hex}}
cursor                 {{colors.on_surface.default.hex}}
selection_background   {{colors.surface_container_high.default.hex}}
selection_foreground   {{colors.on_surface.default.hex}}
<* if {{ is_dark_mode }} *>
# ---------------------------------------------------------
# BASE PALETTE (dinámica · oscuro)
# ---------------------------------------------------------
color0  {{colors.surface_container.default.hex}}
color8  {{colors.outline.default.hex}}

color1  {{colors.error.default.hex}}
color9  {{colors.error.default.hex}}

color2  {{colors.secondary.default.hex}}
color10 {{colors.secondary.default.hex}}

color3  {{colors.tertiary.default.hex}}
color11 {{colors.tertiary.default.hex}}

color4  {{colors.primary.default.hex}}
color12 {{colors.primary.default.hex}}

# 5/13/14 eran on_*_container: con --contrast > 0 salen NEGROS en oscuro
# (medido: #000000 con scheme-content y 0.5). Mismo truco que la rama clara.
color5  {{colors.primary.default.hex | set_hue: 300}}
color13 {{colors.primary.default.hex | lighten: 8 | set_hue: 300}}

color6  {{colors.primary.default.hex}}
color14 {{colors.primary.default.hex | lighten: 8 | set_hue: 185}}

color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}
<* else *>
# ---------------------------------------------------------
# BASE PALETTE (dinámica · claro)
# ---------------------------------------------------------
# En claro los roles on_*_container / *_fixed_variant salen BLANCOS con
# scheme-content o con contraste > 0, y surface_container es casi el fondo:
# texto invisible. Aquí solo roles que Material garantiza oscuros sobre
# `background` en claro (primary, error, on_surface*, outline, inverse_surface).
# Los tonos ANSI salen de `primary` rotando el matiz: conservan la saturación
# y la claridad del wallpaper (y el contraste), pero rojo≠verde≠azul de verdad.
# `bright` = el mismo matiz un poco más claro (lighten ANTES de set_hue: al
# revés matugen devuelve gris), para distinguirlo sin perder
# legibilidad. Con scheme-monochrome salen grises, como debe ser.
color0  {{colors.inverse_surface.default.hex}}
color8  {{colors.outline.default.hex}}

color1  {{colors.error.default.hex}}
color9  {{colors.primary.default.hex | lighten: 8 | set_hue: 0}}

color2  {{colors.primary.default.hex | set_hue: 120}}
color10 {{colors.primary.default.hex | lighten: 8 | set_hue: 120}}

color3  {{colors.primary.default.hex | set_hue: 45}}
color11 {{colors.primary.default.hex | lighten: 8 | set_hue: 45}}

color4  {{colors.primary.default.hex | set_hue: 215}}
color12 {{colors.primary.default.hex | lighten: 8 | set_hue: 215}}

color5  {{colors.primary.default.hex | set_hue: 300}}
color13 {{colors.primary.default.hex | lighten: 8 | set_hue: 300}}

color6  {{colors.primary.default.hex | set_hue: 185}}
color14 {{colors.primary.default.hex | lighten: 8 | set_hue: 185}}

color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}
<* endif *>
